<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cálculo da Média</title>
</head>
<body>
    <h1>Cálculo da Média</h1>

    <form action="/media" method="get">
        <label for="p1">P1:</label>
        <input type="number" id="p1" name="p1" step="0.1" required>
        <br><br>

        <label for="p2">P2:</label>
        <input type="number" id="p2" name="p2" step="0.1" required>
        <br><br>

        <button type="submit">Calcular média</button>
    </form>
</body>
</html>
